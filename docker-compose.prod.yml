version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: loanapi-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-LoanDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loanapi-network
    restart: unless-stopped

  # .NET API Service (with built-in Angular SPA)
  webapi:
    build:
      context: .
      dockerfile: WebApi/Dockerfile
    container_name: loanapi-webapi-prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-LoanDB};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - UseInMemoryDatabase=false
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - loanapi-network
    restart: unless-stopped

volumes:
  postgres_data_prod:

networks:
  loanapi-network:
    driver: bridge

