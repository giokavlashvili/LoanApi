<div class="form-container">
  <div class="form-card">
    <h1>{{ isEditMode() ? 'Edit' : 'Create' }} Loan Application</h1>

    @if (errorMessage()) {
      <div class="error-banner">{{ errorMessage() }}</div>
    }

    @if (isLoading()) {
      <div class="loading">Loading form data...</div>
    } @else {
      <form (ngSubmit)="onSubmit()" #applicationForm="ngForm">
        <div class="form-group">
          <label for="loanTypeId">Loan Type *</label>
          <select
            id="loanTypeId"
            name="loanTypeId"
            [(ngModel)]="formData.loanTypeId"
            required
            [disabled]="isSaving()"
            class="form-control"
          >
            <option [value]="0">Select a loan type</option>
            @for (type of loanTypes(); track type.id) {
              <option [value]="type.id">{{ type.name }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="amount">Amount *</label>
          <input
            type="number"
            id="amount"
            name="amount"
            [(ngModel)]="formData.amount"
            required
            min="0.01"
            step="0.01"
            [disabled]="isSaving()"
            class="form-control"
            placeholder="Enter loan amount"
          />
        </div>

        <div class="form-group">
          <label for="currencyId">Currency *</label>
          <select
            id="currencyId"
            name="currencyId"
            [(ngModel)]="formData.currencyId"
            required
            [disabled]="isSaving()"
            class="form-control"
          >
            <option [value]="0">Select a currency</option>
            @for (currency of currencies(); track currency.id) {
              <option [value]="currency.id">{{ currency.name }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="periodPerMonth">Period (Months) *</label>
          <input
            type="number"
            id="periodPerMonth"
            name="periodPerMonth"
            [(ngModel)]="formData.periodPerMonth"
            required
            min="1"
            [disabled]="isSaving()"
            class="form-control"
            placeholder="Enter loan period in months"
          />
        </div>

        <div class="form-actions">
          <button
            type="button"
            class="btn-cancel"
            (click)="cancel()"
            [disabled]="isSaving()"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="btn-submit"
            [disabled]="isSaving() || !applicationForm.valid"
          >
            @if (isSaving()) {
              <span>Saving...</span>
            } @else {
              <span>{{ isEditMode() ? 'Update' : 'Create' }}</span>
            }
          </button>
        </div>
      </form>
    }
  </div>
</div>
