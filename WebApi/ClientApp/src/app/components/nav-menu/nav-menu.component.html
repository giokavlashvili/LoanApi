<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
      <a routerLink="/" routerLinkActive="active">Loan Management</a>
    </div>
    <div class="nav-menu">
      @if (isAuthenticated()) {
        <a routerLink="/loan-applications" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
          Loan Applications
        </a>
      }
    </div>
    <div class="nav-auth">
      @if (isAuthenticated()) {
        <a [href]="logoutUrl" class="btn-logout">Logout</a>
      } @else {
        <a [href]="loginUrl" class="btn-login">Login</a>
      }
    </div>
  </div>
</nav>
